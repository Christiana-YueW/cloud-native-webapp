name: Integration Tests (Postman/Newman)

on:
  pull_request:
    branches: ["main"]
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  newman:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cloud_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d cloud_app"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cloud_app
      S3_BUCKET_NAME: mock-bucket-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Newman
        run: npm install -g newman

      - name: Install Postgres client (for pg_isready)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h 127.0.0.1 -p 5432 -U postgres -d cloud_app && exit 0
            echo "waiting postgres... ($i)"
            sleep 2
          done
          echo "Postgres not ready"
          exit 1

      # OPTIONAL: if you use Alembic migrations, uncomment this:
      # - name: Run DB migrations
      #   run: alembic upgrade head

      - name: Start API (Uvicorn)
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 --log-level debug > uvicorn.log 2>&1 &
          sleep 1

      - name: Wait for /healthz
        run: |
          ok=0
          for i in {1..30}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/healthz || true)
            if [ "$code" = "200" ]; then
              echo "✓ healthz ok"
              ok=1
              break
            fi
            echo "waiting... ($i) code=$code"
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            echo "✗ API failed to start. uvicorn log:"
            tail -200 uvicorn.log || true
            exit 1
          fi

      - name: Run Newman collection
        id: newman
        continue-on-error: true
        run: |
          echo "Running Newman tests (CI: Health + User + Courses, Syllabus skipped)..."
          newman run postman_collection.json \
            --env-var base_url=http://127.0.0.1:8000 \
            --folder "Health Check Tests" \
            --folder "User API Tests" \
            --folder "Course API Tests" \
            --timeout-request 10000 \
            --timeout-script 10000 \
            --reporters cli \
            --reporter-cli-no-banner \
            --color on

      - name: Debug - Manual requests on failure
        if: steps.newman.outcome == 'failure'
        run: |
          echo "=========================================="
          echo "GET /healthz"
          echo "=========================================="
          curl -sS -v http://127.0.0.1:8000/healthz 2>&1 | head -60

          echo "=========================================="
          echo "POST /v1/user"
          echo "=========================================="
          u="debug-$(date +%s)@example.com"
          curl -sS -v -X POST http://127.0.0.1:8000/v1/user \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"$u\",\"password\":\"DebugPassword123!\",\"first_name\":\"Debug\",\"last_name\":\"Test\"}" \
            2>&1 | head -120

          echo "=========================================="
          echo "GET /v1/courses (no auth — expect 401)"
          echo "=========================================="
          curl -sS -v http://127.0.0.1:8000/v1/courses 2>&1 | head -80

      - name: Debug - Print API logs on failure
        if: steps.newman.outcome == 'failure'
        run: |
          echo "=========================================="
          echo "API Logs (last 200 lines)"
          echo "=========================================="
          tail -200 uvicorn.log || echo "No uvicorn.log found"

      - name: Fail if Newman failed
        if: steps.newman.outcome == 'failure'
        run: exit 1