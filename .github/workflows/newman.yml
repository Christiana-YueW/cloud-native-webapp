name: Integration Tests (Postman/Newman)

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "**" ]  # Run on all branches to test secrets
  workflow_dispatch:  # Allow manual trigger

jobs:
  newman:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cloud_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d cloud_app"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # for FastAPI 
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cloud_app

      # for newman 
      TEST_USER_USERNAME: ${{ secrets.TEST_USER_USERNAME }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      TEST_USER_NEW_PASSWORD: ${{ secrets.TEST_USER_NEW_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Newman
        run: |
          npm install -g newman

      - name: Debug - Check environment variables
        run: |
          echo "Checking if secrets are set..."
          echo "TEST_USER_USERNAME is set: ${{ secrets.TEST_USER_USERNAME != '' }}"
          echo "TEST_USER_PASSWORD is set: ${{ secrets.TEST_USER_PASSWORD != '' }}"
          echo "TEST_USER_NEW_PASSWORD is set: ${{ secrets.TEST_USER_NEW_PASSWORD != '' }}"
          if [ -z "$TEST_USER_USERNAME" ]; then
            echo "⚠️ WARNING: TEST_USER_USERNAME is empty!"
          fi
          if [ -z "$TEST_USER_PASSWORD" ]; then
            echo "⚠️ WARNING: TEST_USER_PASSWORD is empty!"
          fi

      
      
      
      - name: Fallback credentials when secrets are missing
        run: |
          if [ -z "$TEST_USER_USERNAME" ]; then
            echo "TEST_USER_USERNAME=ci-$(date +%s)@example.com" >> $GITHUB_ENV
          fi
          if [ -z "$TEST_USER_PASSWORD" ]; then
            echo "TEST_USER_PASSWORD=TestPassword123!" >> $GITHUB_ENV
          fi
          if [ -z "$TEST_USER_NEW_PASSWORD" ]; then
            echo "TEST_USER_NEW_PASSWORD=NewPassword123!" >> $GITHUB_ENV
          fi


      - name: Prepare Postman environment from template
        run: |
          node -e "
          const fs=require('fs');
          const p='postman_environment.template.json';
          const env=JSON.parse(fs.readFileSync(p,'utf8'));
          const m={
            test_user_username: process.env.TEST_USER_USERNAME,
            test_user_password: process.env.TEST_USER_PASSWORD,
            test_user_new_password: process.env.TEST_USER_NEW_PASSWORD
          };
          env.values=env.values.map(v=> m[v.key]!==undefined ? {...v, value:m[v.key]} : v);
          fs.writeFileSync('postman_environment.ci.json', JSON.stringify(env,null,2));
          "

      - name: Debug - Show generated environment (masked)
        run: |
          echo "Generated Postman environment file:"
          cat postman_environment.ci.json | jq '.values[] | {key: .key, value_length: (.value | length)}'

      - name: Reset database
        run: |
          echo "Resetting database to ensure clean state..."
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c "DROP DATABASE IF EXISTS cloud_app;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c "CREATE DATABASE cloud_app;"
          echo "✓ Database reset complete"

      - name: Start API (Uvicorn)
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > uvicorn.log 2>&1 &
          sleep 2

      - name: Wait for /healthz
        run: |
          for i in {1..30}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/healthz || true)
            if [ "$code" = "200" ]; then
              echo "✓ healthz ok"
              exit 0
            fi
            echo "waiting... ($i) code=$code"
            sleep 2
          done
          echo "✗ API failed to start. uvicorn log:"
          cat uvicorn.log || true
          exit 1

      - name: Debug - Test create user endpoint manually
        run: |
          echo "Testing create user endpoint with test credentials..."
          echo "Username length: ${#TEST_USER_USERNAME}"
          echo "Password length: ${#TEST_USER_PASSWORD}"
          echo ""
          echo "Sending POST request to /v1/user..."
          curl -v -X POST http://127.0.0.1:8000/v1/user \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"debug-test@example.com\",\"password\":\"DebugPassword123!\",\"first_name\":\"Debug\",\"last_name\":\"Test\"}" \
            2>&1 | head -50

      - name: Run Newman collection
        run: |
          echo "Running Newman tests..."
          newman run postman_collection.json \
            -e postman_environment.ci.json \
            --env-var base_url=http://127.0.0.1:8000 \
            --env-var test_user_username=ci-$(date +%s)@example.com \
            --reporters cli \
            --reporter-cli-no-banner \
            --color on
          
      - name: Debug - Print logs on failure
        if: failure()
        run: |
          echo "=========================================="
          echo "Environment Debug Info"
          echo "=========================================="
          echo "TEST_USER_USERNAME length: ${#TEST_USER_USERNAME}"
          echo "TEST_USER_PASSWORD length: ${#TEST_USER_PASSWORD}"
          echo ""
          echo "=========================================="
          echo "Generated Postman Environment (masked)"
          echo "=========================================="
          cat postman_environment.ci.json | jq '.' || cat postman_environment.ci.json
          echo ""
          echo "=========================================="
          echo "API Logs (uvicorn.log)"
          echo "=========================================="
          cat uvicorn.log || echo "No uvicorn.log found"
