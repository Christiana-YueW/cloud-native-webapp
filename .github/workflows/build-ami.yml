name: Build AMI

on:
  pull_request:
    types: [closed]
    branches:
      - main

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.pull_request.merged == true

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: csye6225_user
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: csye6225_db
        options: >-
          --health-cmd="pg_isready -U csye6225_user -d csye6225_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Postgres client (for pg_isready)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        env:
          PGPASSWORD: testpassword
        run: |
          for i in {1..30}; do
            pg_isready -h 127.0.0.1 -p 5432 -U csye6225_user -d csye6225_db && exit 0
            echo "waiting postgres... ($i)"
            sleep 2
          done
          echo "Postgres not ready"
          exit 1

      - name: Start application
        env:
          DATABASE_URL: "postgresql://csye6225_user:testpassword@127.0.0.1:5432/csye6225_db"
          S3_BUCKET_NAME: "mock-bucket-ci"
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 --log-level debug > uvicorn.log 2>&1 &
          sleep 1
          ok=0
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/healthz > /dev/null; then
              ok=1
              echo "App is up"
              break
            fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            echo "App failed to start in time"
            echo "Healthz debug:"
            curl -v http://localhost:8000/healthz || true
            tail -200 uvicorn.log || true
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run integration tests
        run: |
          npm install -g newman
          newman run postman_collection.json \
            --folder "Health Check Tests" \
            --folder "User API Tests" \
            --folder "Course API Tests" \
            --env-var base_url=http://localhost:8000 \
            --timeout-request 10000 \
            --timeout-script 10000 \
            --reporters cli \
            --reporter-cli-no-banner \
            --color on

      - name: Upload uvicorn log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uvicorn-log
          path: uvicorn.log

  build-artifact:
    runs-on: ubuntu-latest
    needs: integration-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build application artifact
        run: zip -r -q webapp.zip app/ requirements.txt scripts/ -x "*.git*" "*__pycache__*" "*.DS_Store*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-zip
          path: webapp.zip

  build-ami:
    runs-on: ubuntu-latest
    needs: build-artifact
    outputs:
      ami_id: ${{ steps.get-ami.outputs.AMI_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp-zip
          path: .

      - name: Verify artifact
        run: ls -lah webapp.zip

      - name: Configure AWS credentials (DEV)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: "1.15.0"

      - name: Packer Init
        working-directory: packer
        run: packer init aws-gcp.pkr.hcl

      - name: Packer Validate
        working-directory: packer
        run: packer validate -var "app_zip=../webapp.zip" aws-gcp.pkr.hcl

      - name: Build AWS AMI and GCP Image
        working-directory: packer
        env:
          PACKER_LOG: "1"
          PACKER_LOG_PATH: "packer.log"
        run: |
          packer build \
            -only="aws.amazon-ebs.ubuntu" \
            -var "app_zip=../webapp.zip" \
            aws-gcp.pkr.hcl


      - name: Get AMI ID
        id: get-ami
        run: |
          AMI_ID=$(aws ec2 describe-images \
            --owners self \
            --filters "Name=name,Values=csye6225-webapp-*" \
            --query "sort_by(Images, &CreationDate)[-1].ImageId" \
            --output text)
          echo "AMI_ID=$AMI_ID" >> $GITHUB_OUTPUT
          echo "Latest AMI ID: $AMI_ID"

      - name: Share AMI with DEMO account
        run: |
          aws ec2 modify-image-attribute \
            --image-id ${{ steps.get-ami.outputs.AMI_ID }} \
            --launch-permission "Add=[{UserId=${{ secrets.DEMO_AWS_ACCOUNT_ID }}}]"


      - name: Upload packer log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packer-log
          path: packer/packer.log

  deploy-demo:
    runs-on: ubuntu-latest
    needs: build-ami
    timeout-minutes: 45

    steps:
      - name: Configure AWS credentials (DEMO)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DEMO_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEMO_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Create new Launch Template version
        run: |
          aws ec2 create-launch-template-version \
            --launch-template-name ${{ vars.DEMO_LAUNCH_TEMPLATE_NAME }} \
            --source-version '$Latest' \
            --launch-template-data "{\"ImageId\":\"${{ needs.build-ami.outputs.ami_id }}\"}"

      - name: Start instance refresh
        id: start-refresh
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ${{ vars.DEMO_AUTO_SCALING_GROUP_NAME }} \
            --preferences '{"MinHealthyPercentage": 50}' \
            --query "InstanceRefreshId" \
            --output text)
          echo "REFRESH_ID=$REFRESH_ID" >> $GITHUB_OUTPUT
          echo "Instance refresh started: $REFRESH_ID"

      - name: Wait for instance refresh to complete
        run: |
          REFRESH_ID="${{ steps.start-refresh.outputs.REFRESH_ID }}"
          echo "Waiting for instance refresh $REFRESH_ID to complete..."

          while true; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name ${{ vars.DEMO_AUTO_SCALING_GROUP_NAME }} \
              --instance-refresh-ids "$REFRESH_ID" \
              --query "InstanceRefreshes[0].Status" \
              --output text)

            echo "Current status: $STATUS"

            if [ "$STATUS" = "Successful" ]; then
              echo "Instance refresh completed successfully!"
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "Instance refresh failed with status: $STATUS"
              exit 1
            fi

            sleep 30
          done